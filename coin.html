<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin details — Candlepoint</title>
  <style>
    :root { font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#192a33; background:#f6f8f7; font-synthesis:none }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh }
    a { color:#176d60; text-decoration:none; font-weight:650 }
    a:hover { text-decoration:underline }
    a:focus-visible, button:focus-visible, select:focus-visible { outline:3px solid #62b4a0; outline-offset:3px }
    button, select { font:inherit }
    .site-header { background:#fff; border-bottom:1px solid #e2e8e7 }
    .site-header-inner { max-width:1300px; margin:auto; padding:17px clamp(20px,4vw,64px); display:flex; justify-content:space-between; align-items:center; gap:20px }
    .brand { display:flex; align-items:center; gap:12px; color:inherit }
    .brand:hover { text-decoration:none }
    .brand-mark { width:38px; height:38px; border-radius:10px; background:#143c39; color:#fff; display:grid; place-items:center; font-size:15px; font-weight:750; letter-spacing:-.05em }
    .brand-name { display:block; font-size:15px; font-weight:750; letter-spacing:-.025em }
    .brand-subtitle { display:block; color:#74848a; font-size:11px; margin-top:2px; font-weight:400 }
    .header-back { font-size:13px }
    main { max-width:1300px; margin:auto; padding:36px clamp(20px,4vw,64px) 64px }
    .back-link { font-size:12px }
    .hero { display:flex; justify-content:space-between; align-items:end; gap:24px; margin:25px 0 24px }
    .eyebrow { color:#568078; text-transform:uppercase; font-size:11px; font-weight:750; letter-spacing:.12em; margin:0 0 9px }
    h1 { font-size:clamp(32px,4vw,48px); letter-spacing:-.055em; line-height:1.1; margin:0; font-weight:720 }
    .quote { color:#8a9b9e; font-size:.53em; font-weight:500; letter-spacing:-.025em }
    .hero-copy { color:#687c82; font-size:13px; line-height:1.5; margin:9px 0 0 }
    .hero-price { text-align:right; font-variant-numeric:tabular-nums }
    .hero-price span { display:block; color:#7b8d92; font-size:11px; margin-bottom:5px }
    .hero-price strong { display:block; font-size:25px; letter-spacing:-.035em }
    .summary { display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; min-height:48px; padding:12px 18px; border:1px solid #dce5e3; border-radius:10px; background:#fff; color:#61747a; font-size:12px }
    .summary strong { color:#223940 }
    .summary .dot { width:7px; height:7px; border-radius:50%; background:#269376; box-shadow:0 0 0 4px #e7f5ef }
    .panel { background:#fff; border:1px solid #dfe7e5; border-radius:12px; box-shadow:0 1px 3px #102f2805 }
    .chart-panel { padding:20px; margin-top:18px }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:14px }
    h2 { margin:0; font-size:19px; letter-spacing:-.035em }
    .chart-tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px }
    .intervals { display:flex; gap:3px; padding:3px; border:1px solid #dce5e3; border-radius:8px; background:#f5f8f7 }
    .intervals button { min-height:32px; padding:6px 10px; border:0; border-radius:5px; background:transparent; color:#61747a; cursor:pointer; font-size:12px; font-weight:650 }
    .intervals button:hover { background:#eaf1ef }
    .intervals button.active { background:#fff; color:#176d5d; box-shadow:0 1px 4px #143c391c }
    select { min-height:38px; padding:8px 10px; border:1px solid #d8e1df; border-radius:7px; background:#fff; color:#2c444b; font-size:12px; font-weight:600 }
    .readout { display:flex; flex-wrap:wrap; gap:8px 18px; min-height:28px; margin:8px 0; color:#60777b; font-size:12px; font-variant-numeric:tabular-nums }
    .chart-area { height:440px; display:flex; flex-direction:column; background:#f8faf9; border:1px solid #e1e9e6; border-radius:8px; overflow:hidden }
    .chart-pane { position:relative; min-height:0 }
    .price-pane { flex:7 }
    .macd-pane { flex:3; border-top:1px solid #e1e9e6 }
    canvas { width:100%; height:100%; display:block }
    .chart-foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; color:#71848a; font-size:11px }
    .chart-foot a { font-size:12px }
    .signals-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:32px 0 14px }
    .signals-head span { color:#71838a; font-size:12px }
    #signals { display:grid; gap:12px }
    .signal { padding:20px }
    .signal-heading { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px }
    .signal h3 { margin:0 8px 0 0; font-size:17px; letter-spacing:-.025em }
    .badge { display:inline-block; border:1px solid #d4ead9; border-radius:5px; background:#eaf5ed; color:#236d55; padding:4px 7px; font-size:10px; font-weight:750; letter-spacing:.045em; text-transform:uppercase; line-height:1 }
    .badge.secondary { color:#4d6090; background:#edf0f8; border-color:#dfe5f3 }
    .badge.new { color:#155e8a; background:#eaf4fa; border-color:#d4e8f4 }
    .badge.provisional { color:#826c3e; background:#faf5e9; border-color:#eee5d0 }
    .reason { color:#526b71; font-size:13px; line-height:1.6; margin:0 0 19px; max-width:1000px }
    dl { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px 22px; margin:0 }
    dt { color:#829297; font-size:11px; line-height:1.35 }
    dd { margin:5px 0 0; font-size:13px; font-weight:650; font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
    .signal-footer { border-top:1px solid #e9eeec; padding-top:14px; margin-top:19px; display:flex; gap:16px; flex-wrap:wrap; font-size:12px }
    .message { padding:28px; color:#687c82; font-size:13px; line-height:1.6 }
    .message strong { color:#223940 }
    [hidden] { display:none !important }
    @media (max-width:850px) { dl { grid-template-columns:repeat(3,minmax(0,1fr)) } .section-head { align-items:start; flex-direction:column } }
    @media (max-width:600px) { main { padding-top:25px } .hero { align-items:start; flex-direction:column; gap:15px } .hero-price { text-align:left } .hero-price strong { font-size:22px } .chart-panel,.signal { padding:15px } .chart-area { height:360px } dl { grid-template-columns:repeat(2,minmax(0,1fr)) } .header-back { display:none } }
  </style>
</head>
<body>
  <header class="site-header"><div class="site-header-inner">
    <a class="brand" href="/"><span class="brand-mark">C</span><span><span class="brand-name">Candlepoint</span><span class="brand-subtitle">Market signals</span></span></a>
    <a class="header-back" href="/">← All signals</a>
  </div></header>
  <main>
    <a class="back-link" href="/">← Back to all signals</a>
    <div class="hero"><div><p class="eyebrow">Coin details</p><h1 id="coin-name">Loading…</h1><p class="hero-copy" id="hero-copy">Loading the latest scan for this pair.</p></div><div class="hero-price" id="hero-price" hidden><span>Last scanned price</span><strong id="price"></strong></div></div>
    <div class="summary" id="summary" role="status">Loading scan details…</div>
    <section class="panel chart-panel" id="chart-section" aria-labelledby="chart-heading" hidden>
      <div class="section-head"><h2 id="chart-heading">Price history</h2><div class="chart-tools"><div class="intervals" id="quote-options" role="group" aria-label="Chart currency" hidden><button type="button" data-quote="BTC">BTC</button><button type="button" data-quote="USDT">USD (USDT)</button></div><div class="intervals" role="group" aria-label="Candle timeframe"><button type="button" data-interval="1h">1 hour</button><button type="button" data-interval="1d">Daily</button><button type="button" data-interval="1w">Weekly</button><button type="button" data-interval="1M">Monthly</button></div><label for="chart-range">Show <select id="chart-range"><option value="all">Full history</option><option value="36">Latest 36 candles</option><option value="80">Latest 80 candles</option></select></label></div></div>
      <div class="readout" id="readout" aria-live="polite"></div>
      <div class="chart-area"><div class="chart-pane price-pane"><canvas id="price-chart" aria-label="Price candlestick chart with Bollinger bands"></canvas></div><div class="chart-pane macd-pane"><canvas id="macd-chart" aria-label="MACD line, signal and histogram"></canvas></div></div>
      <div class="chart-foot"><span id="chart-note">Green / red candles · shaded Bollinger bands (21, 2) · MACD below</span><a id="full-chart-link" href="/">Open full chart ↗</a></div>
    </section>
    <div class="signals-head"><h2>Current signals</h2><span id="signal-count"></span></div>
    <div id="signals"></div>
  </main>
  <script src="/bollinger_bands.js"></script>
  <script src="/coin.js"></script>
</body>
</html>
